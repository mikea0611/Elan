<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dress Details | Élan</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">ÉLAN</a>
    <nav><a href="index.html">Home</a><a href="dresses.html">Dresses</a><a href="how.html">How It Works</a><a href="contact.html">Contact</a></nav>
  </header>
  <main class="product-shell">
    <a class="back-link" href="dresses.html">← Back to Dresses</a>
    <p id="loadingMessage" role="status">Loading dress information...</p>
    <section id="productDetails" class="product-layout" hidden>
      <img id="productImage" class="product-photo" alt="">
      <div class="product-copy">
        <p class="eyebrow">THE ÉLAN COLLECTION</p>
        <h1 id="productName"></h1>
        <p id="productPrice" class="product-price"></p>
        <div class="product-rule"></div>
        <p id="productCategory" class="elan-product-category"></p>
        <p id="productDescription" class="product-description"></p>
        <p id="productAvailability" class="elan-product-availability"></p>
        <p class="elan-availability-note">Dates and sizes are subject to rental confirmation.</p>
        <label for="dressSize">Select your size</label>
        <select id="dressSize" required></select>
        <p class="small-note">Rental duration: 4 days</p>
        <button id="addToBag" class="bag-button" type="button">Add to Rental Bag</button>
        <p id="bagMessage" class="bag-message" role="status"></p>
        <a class="back-link" href="cart.html">View Rental Bag →</a>
      </div>
    </section>
  </main>
  <script src="product.js"></script>
<script src="catalog-enhancements.js"></script>
</body>
</html>
